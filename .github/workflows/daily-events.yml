name: Twice-daily five-city event radar

on:
  schedule:
    # UTC 04:00 / 16:00 = Asia/Shanghai 12:00 / next-day 00:00.
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/sync-events.mjs
        id: beijing
        continue-on-error: true
      - run: node scripts/sync-city-events.mjs
        id: cities
        continue-on-error: true
      - run: npm ci
      - run: npm run build
      - name: Commit new discoveries
        run: |
          git config user.name "cityplay-bot"
          git config user.email "cityplay-bot@users.noreply.github.com"
          git add data/daily-discoveries.json data/city-discoveries/
          git diff --cached --quiet || git commit -m "data: refresh five-city event radar"
          git push
      - name: Report source failures
        if: steps.beijing.outcome == 'failure' || steps.cities.outcome == 'failure'
        run: exit 1
