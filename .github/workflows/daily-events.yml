name: Daily Beijing event radar

on:
  schedule:
    # GitHub Actions cron uses UTC; 00:00 UTC is 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-events.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit new discoveries
        run: |
          git config user.name "cityplay-bot"
          git config user.email "cityplay-bot@users.noreply.github.com"
          git add data/daily-discoveries.json
          git diff --cached --quiet || git commit -m "data: refresh Beijing event radar"
          git push
